<!DOCTYPE html>
<html lang="en" class="h-screen overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheris Duel Arena</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #07090e; color: #f3f4f6; height: 100vh; overflow: hidden; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .glow-gold { text-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
        .glow-box { box-shadow: 0 0 25px rgba(59, 130, 246, 0.15); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .fantasy-frame { border: 2px solid #64748b; box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 4px 12px rgba(0,0,0,0.6); }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Top Navigation Bar -->
    <header id="main-header" class="border-b border-slate-800 bg-slate-950/95 backdrop-blur px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 shrink-0 z-50">
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div>
                <h1 class="font-cinzel font-bold text-sm sm:text-lg tracking-wider text-amber-400">AETHERIS DUEL</h1>
                <p class="text-[10px] text-slate-400">Cloud-Synced Secure P2P Arena</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <div id="nav-wallet-container" class="hidden items-center space-x-1.5 bg-slate-900 border border-slate-700 rounded-full px-3 py-1">
                <span class="text-[11px] text-slate-400">Wallet:</span>
                <span id="nav-wallet" class="text-xs sm:text-sm font-bold text-emerald-400">₱0.00</span>
            </div>
            <nav id="nav-menu" class="hidden space-x-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('hub')" id="btn-hub" class="px-3 py-1 rounded-lg text-[11px] sm:text-xs font-semibold bg-blue-600 text-white transition">Home</button>
                <button onclick="switchTab('select')" id="btn-roster" class="px-3 py-1 rounded-lg text-[11px] sm:text-xs font-semibold text-slate-400 hover:text-white transition">Roster</button>
                <button onclick="logoutPlayer()" class="px-2.5 py-1 rounded-lg text-[11px] sm:text-xs font-semibold text-red-400 hover:bg-red-500/10 transition">Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-main" class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6 overflow-y-auto flex flex-col pb-12">

        <!-- AUTH VIEW -->
        <div id="view-auth" class="max-w-md w-full mx-auto space-y-3 py-2 my-auto">
            <div class="text-center space-y-1">
                <h2 class="font-cinzel text-2xl sm:text-3xl font-bold text-amber-400 glow-gold">AETHERIS ARENA</h2>
                <p class="text-xs text-slate-400">Cloud Peer-to-Peer Tactical Card & Combat Arena</p>
            </div>

            <!-- Login Box -->
            <div id="auth-login-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3 glow-box">
                <h3 class="font-cinzel text-base font-bold text-white">Secure Sign In</h3>
                <div class="space-y-2.5">
                    <input type="email" id="login-email" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <div class="relative">
                        <input type="password" id="login-pass" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white pr-10">
                        <button type="button" onclick="togglePass('login-pass', this)" class="absolute right-3 top-2 text-slate-400 text-xs font-bold hover:text-white">SHOW</button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <button onclick="showAuthMode('register')" class="text-blue-400 hover:underline">Create Account</button>
                </div>
                <button onclick="handleLogin()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg transition">Sign In</button>
            </div>

            <!-- Register Box -->
            <div id="auth-register-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3 glow-box hidden">
                <h3 class="font-cinzel text-base font-bold text-white">Create Player Account</h3>
                <p class="text-xs text-amber-400/90">*Note: A ₱50.00 registration fee applies. Unique email & phone enforced.</p>
                <div class="space-y-2.5">
                    <input type="text" id="reg-name" placeholder="Full Legal Name" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="text" id="reg-nickname" placeholder="Player Username / Nickname" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="text" id="reg-phone" placeholder="Phone Number" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="email" id="reg-email" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="date" id="reg-bday" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="password" id="reg-pass" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input type="text" id="reg-ref" placeholder="Transaction Reference Number" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="flex items-center justify-between text-xs pt-1">
                    <button onclick="showAuthMode('login')" class="text-blue-400 hover:underline">Back to Sign In</button>
                </div>
                <button onclick="handleRegister()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg transition">Register Account</button>
            </div>
        </div>

        <!-- Player Hub View -->
        <div id="view-hub" class="hidden space-y-3 py-2">
            <div class="bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between glow-box">
                <div>
                    <span id="player-nickname-badge" class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Player</span>
                    <h2 id="active-hero-name" class="font-cinzel text-base sm:text-lg font-bold text-white">PYRA</h2>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ================= SUPABASE CONFIGURATION =================
        const SUPABASE_URL = 'https://qocrpleireoffykeendn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MzwC0zj5QfPLNvTkcphyww_5pObb4cM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = JSON.parse(localStorage.getItem('aetheris_current_user')) || null;

        window.addEventListener('DOMContentLoaded', async () => {
            if (currentUser && currentUser.email) {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single();
                
                if (data && !error) {
                    currentUser = data;
                    restoreUserSession();
                } else {
                    currentUser = null;
                    localStorage.removeItem('aetheris_current_user');
                }
            }
        });

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') { input.type = 'text'; btn.innerText = 'HIDE'; }
            else { input.type = 'password'; btn.innerText = 'SHOW'; }
        }

        function showAuthMode(mode) {
            document.getElementById('auth-login-box').classList.add('hidden');
            document.getElementById('auth-register-box').classList.add('hidden');
            if(mode === 'login') document.getElementById('auth-login-box').classList.remove('hidden');
            if(mode === 'register') document.getElementById('auth-register-box').classList.remove('hidden');
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const bday = document.getElementById('reg-bday').value;
            const pass = document.getElementById('reg-pass').value;
            const refNum = document.getElementById('reg-ref').value.trim();

            if(!name || !nickname || !phone || !email || !bday || !pass || !refNum) { 
                alert('Please fill in all registration fields.'); 
                return; 
            }

            const passHash = await hashPassword(pass);

            const { error } = await supabaseClient.from('profiles').insert([{
                email, pass_hash: passHash, name, nickname, phone, bday,
                role: 'player', balance: 0.00, unlocked_heroes: ['pyra'], active_hero: 'pyra',
                approved: true
            }]);

            if (error) {
                alert('Registration failed: ' + error.message);
                return;
            }

            alert('Account registered successfully in the cloud! You can now sign in.');
            showAuthMode('login');
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            
            if(!email || !pass) {
                alert('Please enter both email and password.');
                return;
            }

            const inputHash = await hashPassword(pass);

            const { data: user, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('email', email)
                .eq('pass_hash', inputHash)
                .single();

            if (error || !user) {
                alert('Invalid email or password.');
                return;
            }

            if (user.frozen) {
                alert('This account has been frozen.');
                return;
            }

            currentUser = user;
            localStorage.setItem('aetheris_current_user', JSON.stringify(currentUser));
            restoreUserSession();
        }

        function restoreUserSession() {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('nav-wallet-container').classList.remove('hidden');
            document.getElementById('nav-menu').classList.remove('hidden');
            document.getElementById('player-nickname-badge').innerText = currentUser.nickname;
            document.getElementById('nav-wallet').innerText = '₱' + (currentUser.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2});
            switchTab('hub');
        }

        function logoutPlayer() {
            currentUser = null;
            localStorage.removeItem('aetheris_current_user');
            location.reload();
        }

        function switchTab(tab) {
            document.getElementById('view-hub').classList.add('hidden');
            if(tab === 'hub') document.getElementById('view-hub').classList.remove('hidden');
        }
    </script>
</body>
</html>
