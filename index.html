<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Icon System Matrix</title>
  <style>
    :root {
      --bg-dark: #0b0c10;
      --border-gold: #c5a059;
      --fire-glow: #ff4500;
      --wind-glow: #00ffcc;
      --iron-glow: #c0c0c0;
      --shadow-glow: #8a2be2;
      --electric-glow: #00bfff;
      --earth-glow: #8b4513;
      --time-glow: #ffd700;
      --light-glow: #fffacd;
      --void-glow: #4b0082;
      --blood-glow: #b22222;
      --cosmic-glow: #1e90ff;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      color: #fff;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      max-width: 800px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .hero-icon-container {
      width: 120px;
      height: 120px;
      position: relative;
      border-radius: 50%;
      border: 4px solid var(--border-gold);
      background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%);
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-icon-container:hover {
      transform: scale(1.05);
    }

    /* Target SVG styles inside the ring wrapper */
    .hero-icon-container svg {
      width: 55%;
      height: 55%;
      fill: #ffffff;
      transition: fill 0.3s ease, filter 0.3s ease;
    }

    .hero-label {
      font-size: 10px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #c5a059;
      font-weight: bold;
    }

    /* Dynamic Archetype Modifier States */
    .hero-icon-container.pyra { box-shadow: 0 0 25px var(--fire-glow); border-color: #ff6347; }
    .hero-icon-container.pyra svg { fill: #ff6347; filter: drop-shadow(0 0 8px var(--fire-glow)); }

    .hero-icon-container.sylph { box-shadow: 0 0 25px var(--wind-glow); border-color: #00ffcc; }
    .hero-icon-container.sylph svg { fill: #00ffcc; filter: drop-shadow(0 0 8px var(--wind-glow)); }

    .hero-icon-container.valen { box-shadow: 0 0 25px rgba(255,255,255,0.4); border-color: #e0e0e0; }
    .hero-icon-container.valen svg { fill: #e0e0e0; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }

    .hero-icon-container.nyx { box-shadow: 0 0 25px var(--shadow-glow); border-color: #ba55d3; }
    .hero-icon-container.nyx svg { fill: #ba55d3; filter: drop-shadow(0 0 8px var(--shadow-glow)); }

    .hero-icon-container.storm-knight { box-shadow: 0 0 25px var(--electric-glow); border-color: #00bfff; }
    .hero-icon-container.storm-knight svg { fill: #00bfff; filter: drop-shadow(0 0 8px var(--electric-glow)); }

    .hero-icon-container.ironclad-titan { box-shadow: 0 0 25px var(--earth-glow); border-color: #cd853f; }
    .hero-icon-container.ironclad-titan svg { fill: #cd853f; filter: drop-shadow(0 0 8px var(--earth-glow)); }

    .hero-icon-container.chrono-warden { box-shadow: 0 0 25px var(--time-glow); border-color: #ffd700; }
    .hero-icon-container.chrono-warden svg { fill: #ffd700; filter: drop-shadow(0 0 8px var(--time-glow)); }

    .hero-icon-container.sky-valkyrie { box-shadow: 0 0 25px #fff; border-color: #fffacd; }
    .hero-icon-container.sky-valkyrie svg { fill: #fffacd; filter: drop-shadow(0 0 8px #fff); }

    .hero-icon-container.void-necromancer { box-shadow: 0 0 25px var(--void-glow); border-color: #9400d3; }
    .hero-icon-container.void-necromancer svg { fill: #9400d3; filter: drop-shadow(0 0 8px var(--void-glow)); }

    .hero-icon-container.blood-berserker { box-shadow: 0 0 25px var(--blood-glow); border-color: #ff0000; }
    .hero-icon-container.blood-berserker svg { fill: #ff0000; filter: drop-shadow(0 0 8px var(--blood-glow)); }

    .hero-icon-container.astral-archmage { box-shadow: 0 0 25px var(--cosmic-glow); border-color: #4169e1; }
    .hero-icon-container.astral-archmage svg { fill: #00bfff; filter: drop-shadow(0 0 8px var(--cosmic-glow)); }

    /* Hidden definitions block */
    .svg-library { display: none; }
  </style>
</head>
<body>

  <!-- SVGs Component Library Panel -->
  <svg class="svg-library">
    <defs>
      <!-- Pyra (Fire Mage) -->
      <g id="icon-pyra">
        <path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 7 9.5-.1-.8-.1-1.6.1-2.4C6.6 18.2 5 15.3 5 12c0-3.9 3.1-7 7-7s7 3.1 7 7c0 3.3-1.6 6.2-4.1 7.1.2.8.2 1.6.1 2.4 4.1-1.3 7-5.1 7-9.5 0-5.5-4.5-10-10-10zm0 4c-3.3 0-6 2.7-6 6 0 1.8.8 3.4 2 4.5.3-.8.8-1.5 1.5-2-1-1-1.5-2.4-1.5-4 0-2.2 1.8-4 4-4s4 1.8 4 4c0 1.6-.5 3-1.5 4 .7.5 1.2 1.2 1.5 2 1.2-1.1 2-2.7 2-4.5 0-3.3-2.7-6-6-6z"/>
      </g>
      <!-- Sylph (Wind Ranger) -->
      <g id="icon-sylph">
        <path d="M21 2l-9.5 9.5-3.5-3.5L2 14l4 4-4 4 2 2 4-4 4 4 6-6-3.5-3.5L21 2zm-2 2l-7 7-1.5-1.5 7-7H19z"/>
      </g>
      <!-- Valen (Iron Guardian) -->
      <g id="icon-valen">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3zm6 9c0 4.3-3 8.3-6 9.5-3-1.2-6-5.2-6-9.5V6.4l6-2.2 6 2.2V11z"/>
      </g>
      <!-- Nyx (Shadow Assassin) -->
      <g id="icon-nyx">
        <path d="M21.9 2.1c-.3-.3-.8-.3-1.1 0l-4.2 4.2c-.8-.4-1.8-.4-2.6.1L4.7 15.7c-.4.4-.6 1-.6 1.6V20c0 .6.4 1 1 1h2.7c.6 0 1.1-.2 1.6-.6l9.3-9.3c.5-.8.5-1.8.1-2.6l4.2-4.2c.3-.3.3-.8 0-1.2zM7.3 19H6v-1.3l8.5-8.5 1.3 1.3L7.3 19z"/>
      </g>
      <!-- Storm Knight (Electric Knight) -->
      <g id="icon-storm-knight">
        <path d="M7 2v7h4v2H7v11l10-9h-5v-2h5L7 2z"/>
      </g>
      <!-- Ironclad Titan (Earth Titan) -->
      <g id="icon-ironclad-titan">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </g>
      <!-- Chrono Warden (Time Mage) -->
      <g id="icon-chrono-warden">
        <path d="M19 3.5c0-.8-.7-1.5-1.5-1.5h-11c-.8 0-1.5.7-1.5 1.5v3c0 2.2 1.4 4.1 3.4 4.8-.4.3-.8.6-1.1 1-1.4 1.6-2.3 3.6-2.3 5.9 0 2.6 2.1 4.8 4.8 4.8h1.2v-2h-1.2c-1.5 0-2.8-1.3-2.8-2.8 0-2 2.3-4.5 4.3-6.5l.7-.7.7.7c2 2 4.3 4.5 4.3 6.5 0 1.5-1.3 2.8-2.8 2.8h-1.2v2h1.2c2.6 0 4.8-2.1 4.8-4.8 0-2.3-.9-4.3-2.3-5.9-.3-.4-.7-.7-1.1-1 2-0.7 3.4-2.6 3.4-4.8v-3zm-2 3H7v-1h10v1z"/>
      </g>
      <!-- Sky Valkyrie (Light Warrior) -->
      <g id="icon-sky-valkyrie">
        <path d="M12 2L2 22h5l2-4h6l2 4h5L12 2zm-1 12l2-4 2 4H11z"/>
      </g>
      <!-- Void Necromancer (Void Sorcerer) -->
      <g id="icon-void-necromancer">
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-3.3 0-6-2.7-6-6 0-1.5.5-2.8 1.4-3.9l1.4 1.4c-.5.7-.8 1.6-.8 2.5 0 2.2 1.8 4 4 4s4-1.8 4-4c0-.9-.3-1.8-.8-2.5l1.4-1.4c.9 1.1 1.4 2.4 1.4 3.9 0 3.3-2.7 6-6 6zm0-10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
      </g>
      <!-- Blood Berserker (Blood Brawler) -->
      <g id="icon-blood-berserker">
        <path d="M20.7 5.3l-4-4c-.4-.4-1-.4-1.4 0l-10 10c-.2.2-.3.4-.3.7v4c0 .6.4 1 1 1h4c.3 0 .5-.1.7-.3l10-10c.4-.4.4-1 0-1.4zM10.6 15H8v-2.6l7.5-7.5 2.6 2.6L10.6 15zM4 20h16v2H4v-2z"/>
      </g>
      <!-- Astral Archmage (Cosmic Sorcerer) -->
      <g id="icon-astral-archmage">
        <path d="M12 2L1 21h22L12 2zm0 4.3l6.7 11.7H5.3L12 6.3zm0 3.7c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </g>
    </defs>
  </svg>

  <h1>Hero Icon System Matrix</h1>
  <p>Click any icon to activate its archetype state dynamically.</p>

  <!-- Interactive Matrix Grid Showcase -->
  <div class="matrix-grid">
    <div class="hero-icon-container pyra" onclick="setHeroIcon('pyra', 'icon-pyra', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-pyra"></use></svg>
      <span class="hero-label">Pyra</span>
    </div>
    <div class="hero-icon-container sylph" onclick="setHeroIcon('sylph', 'icon-sylph', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-sylph"></use></svg>
      <span class="hero-label">Sylph</span>
    </div>
    <div class="hero-icon-container valen" onclick="setHeroIcon('valen', 'icon-valen', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-valen"></use></svg>
      <span class="hero-label">Valen</span>
    </div>
    <div class="hero-icon-container nyx" onclick="setHeroIcon('nyx', 'icon-nyx', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-nyx"></use></svg>
      <span class="hero-label">Nyx</span>
    </div>
    <div class="hero-icon-container storm-knight" onclick="setHeroIcon('storm-knight', 'icon-storm-knight', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-storm-knight"></use></svg>
      <span class="hero-label">Storm Knight</span>
    </div>
    <div class="hero-icon-container ironclad-titan" onclick="setHeroIcon('ironclad-titan', 'icon-ironclad-titan', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-ironclad-titan"></use></svg>
      <span class="hero-label">Titan</span>
    </div>
    <div class="hero-icon-container chrono-warden" onclick="setHeroIcon('chrono-warden', 'icon-chrono-warden', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-chrono-warden"></use></svg>
      <span class="hero-label">Chrono</span>
    </div>
    <div class="hero-icon-container sky-valkyrie" onclick="setHeroIcon('sky-valkyrie', 'icon-sky-valkyrie', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-sky-valkyrie"></use></svg>
      <span class="hero-label">Valkyrie</span>
    </div>
    <div class="hero-icon-container void-necromancer" onclick="setHeroIcon('void-necromancer', 'icon-void-necromancer', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-void-necromancer"></use></svg>
      <span class="hero-label">Void</span>
    </div>
    <div class="hero-icon-container blood-berserker" onclick="setHeroIcon('blood-berserker', 'icon-blood-berserker', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-blood-berserker"></use></svg>
      <span class="hero-label">Berserker</span>
    </div>
    <div class="hero-icon-container astral-archmage" onclick="setHeroIcon('astral-archmage', 'icon-astral-archmage', this)">
      <svg viewBox="0 0 24 24"><use xlink:href="#icon-astral-archmage"></use></svg>
      <span class="hero-label">Archmage</span>
    </div>
  </div>

  <script>
    // Dynamic archetype switcher function
    function setHeroIcon(heroClassName, iconIdString, element) {
      // Optional interactive feedback or standalone switcher logic
      console.log(`Activated Hero Class: ${heroClassName} with icon reference #${iconIdString}`);
    }
  </script>

</body>
</html>
